swagger: "2.0"
info:
  title: "API QR - Generador de Códigos QR"
description: "API para generar códigos QR dinámicos con el monto y las compras (referencia)
host: "https://mi-api-irdu.onrender.com/"
basePath: "/"
tags:
  - name: "QR Code"
    description: "Operaciones relacionadas con la generación de códigos QR"
paths:
  /generar_qr/{monto}/{ref}:
    post:
      tags:
        - "QR Code"
      summary: "Generar QR con monto y referencia"
      description: "Genera un código QR enviando monto y referencia por POST"
      parameters:
        - name: "monto"
          in: "path"
          description: "El monto de la transacción"
          required: true
          type: "number"
        - name: "ref"
          in: "path"
          description: "La referencia de la transacción por productos"
          required: true
          type: "string"
      responses:
        200:
          description: "QR generado exitosamente"
          schema:
            type: "string"
            format: "binary"
        400:
          description: "Parámetros faltantes"
        500:
          description: "Error interno"